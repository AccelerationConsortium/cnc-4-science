<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNC Tic-Tac-Toe</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="app-header">
        <img id="ac-logo" src="/static/ac-logo.png" alt="Acceleration Consortium"
             onerror="this.style.display='none'">
        <h1>CNC Tic-Tac-Toe</h1>
    </header>

    <div id="setup" class="controls">
        <select id="mode">
            <option value="1">1-Player</option>
            <option value="2">2-Player</option>
        </select>
        <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
        </select>
        <select id="symbol">
            <option value="X">Play as X</option>
            <option value="O">Play as O</option>
        </select>
        <button id="btn-start">Start Game</button>
    </div>

    <div class="first-note">O goes first</div>

    <main class="game-panel">
        <div class="board-container">
            <div class="board-labels-top">
                <span></span><span>1</span><span>2</span><span>3</span>
            </div>
            <div class="board-with-rows">
                <div class="row-labels">
                    <span>A</span><span>B</span><span>C</span>
                </div>
                <div id="board" class="board"></div>
            </div>
        </div>

        <div id="status" class="status">Click Start Game to begin</div>
        <div id="info-banner" class="info-banner" hidden></div>
        <button id="btn-reset" class="btn-reset" disabled>Reset Board</button>
        <div id="history" class="history"></div>
    </main>

    <details class="debug-bar">
        <summary>API Debug</summary>
        <div class="debug-header">
            <button id="btn-clear-log" class="btn-clear">Clear</button>
        </div>
        <div id="debug-log" class="debug-log"></div>
    </details>

    <script src="/static/game.js"></script>
</body>
</html>

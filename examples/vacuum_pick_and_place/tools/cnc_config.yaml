# CNC machine + deck configuration for the vacuum pick-and-place tic-tac-toe demo.
# Identical schema to examples/liquid_handling/tools/cnc_config.yaml.

cnc:
  com_port: COM6          # Windows: COMx; Linux/RPi: /dev/ttyUSB0
  baud_rate: 115200
  bounds:                 # Genmitsu 3018 envelope; verify yours with Candle.
    x: [0, 280]
    y: [0, 180]
    z: [-37, 0]

virtual: false            # true = log G-code only; no CNC, no vacuum.

move_speed: 2500          # mm/min for XY travel between cells

# Optional XY routing to avoid driving diagonally across the deck (e.g.
# clearing fixed obstacles). When set, every pick/place uses an orthogonal
# dogleg instead of a straight-line move. Comment out the whole block to
# fall back to CNC_Machine.move_to_point_safe.
#
# Current routing: YXYX dogleg.
#   1. Y -> source_y + y_offset       (relative to source, lift before swinging)
#   2. X -> target_x + x_approach     (relative to TARGET, approach column)
#   3. Y -> target_y                  (absolute)
#   4. X -> target_x                  (absolute, slide in)
# The very first travel after homing has no known source Y, so it falls back
# to a straight safe move; every subsequent travel uses the dogleg.
travel:
  axis_order: yxyx
  y_offset: 13.75         # mm, relative to source Y (positive = +Y / up)
  x_approach: -13.75      # mm, relative to target X (negative = approach from -X)

# Z heights for pick-and-place (mm, machine coordinates).
# Measured by hand for the reference build in ASSEMBLY_INSTRUCTIONS.md;
# Z is per (tool, labware, action), not derivable from the labware JSON.
# Remeasure if your build differs — see docs/SETUP.md §4.
z_heights:
  hover: 0.0              # Safe travel height above the deck
  pick: -30.0             # Z to descend when picking up a piece from storage
  place: -25.0            # Z to descend when placing a piece on the board

# Deck layout. Slot IDs follow the cnc_4_slot_deck convention:
# 1 = front-left, 2 = front-right, 3 = back-left, 4 = back-right.
# The cnc_4_slot_deck definition is sized for the Genmitsu 3018-PROVer V2;
# for a larger CNC (3040, 6040, etc.) copy the JSON, remeasure the slot
# corners, and pass the path as `definition:`.
deck:
  definition: cnc_4_slot_deck
  slots:
    storage:   "3"   # storage_15_tuberack_100ul   (X + O piece reservoir)
    gameboard: "4"   # gameboard_15_tuberack_100ul (3x3 play area in cols 2-4)
